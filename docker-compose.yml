services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-5000}:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/attendance-care
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:${CLIENT_PORT:-3000}
      NODE_ENV: development
    depends_on:
      - mongo

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${SERVER_PORT:-5000}/api
    depends_on:
      - server

volumes:
  mongo-data:
